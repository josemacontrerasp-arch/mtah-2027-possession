# Installs the solution exactly as solution/README.md section 9 says and runs the no-data self-test
# (python -m solution.selftest) on Linux, macOS and Windows. The self-test runs the whole prediction
# chain on a synthetic match and compares every stage with the values recorded on the machine that
# produced the submission. No match data is involved anywhere.
name: selftest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "solution/**"
      - "requirements-solution*.txt"
      - ".github/workflows/selftest.yml"

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: OpenMP runtime for LightGBM (macOS only)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: CPU-only build of torch (Linux only; avoids the CUDA download, as documented)
        if: runner.os == 'Linux'
        run: python -m pip install --no-deps torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the pinned environment
        run: python -m pip install -r requirements-solution.txt -c requirements-solution.lock.txt
      - name: Installed packages
        run: python -m pip freeze
      - name: Self-test against the reference machine
        run: python -m solution.selftest
